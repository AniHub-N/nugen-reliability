<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RERA Confidence Audit</title>
<meta name="description" content="Does Nugen's confidence_score tell right answers from wrong ones on Indian real-estate law? An evaluation, and a checker that does the job instead.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single reading column like a gazette page, with statute citations set as
   margin notes on wide screens (the way the Act prints its section headings) and
   inline on phones. One exhibit, two charts, one table. */
:root {
  --paper: #f7f8f6;        /* slightly green-grey paper, not cream */
  --ink: #16201d;
  --ink-2: #4a5652;
  --rule: #dfe4e1;
  --accent: #1f5f8b;       /* ledger blue: Nugen's score */
  --ok: #2f7d4f;           /* checked against the text */
  --bad: #a3392b;          /* contradicted by the text */
  --muted-mark: #9aa5a1;
  --panel: #eef1ef;
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-label: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121816; --ink: #e6ebe8; --ink-2: #a7b3ae; --rule: #2a3431; --accent: #6aa9d6;
    --ok: #6cc08d; --bad: #e0806f; --muted-mark: #66736e; --panel: #1a2220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121816; --ink: #e6ebe8; --ink-2: #a7b3ae; --rule: #2a3431; --accent: #6aa9d6;
  --ok: #6cc08d; --bad: #e0806f; --muted-mark: #66736e; --panel: #1a2220; color-scheme: dark;
}
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.6; }
.page { max-width: 46rem; margin: 0 auto; padding-inline: 1.25rem; padding-block: 3rem 4rem; display: grid; gap: 2.25rem; }
.page > * { min-width: 0; }
header { display: grid; gap: 0.9rem; }
.eyebrow { font-family: var(--f-label); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.35rem; line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 65ch; }
.lede { font-size: 1.2rem; line-height: 1.55; }
section { display: grid; gap: 0.9rem; }
.cite { font-family: var(--f-mono); font-size: 0.85em; color: var(--ink-2); white-space: nowrap; }
.by { font-family: var(--f-label); font-size: 0.85rem; color: var(--ink-2); }

/* the exhibit: one question, two answers, the provision */
.exhibit { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); padding-block: 1.1rem; display: grid; gap: 1rem; }
.exhibit .q { font-family: var(--f-display); font-size: 1.15rem; font-style: italic; }
.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
.answer { display: grid; gap: 0.4rem; align-content: start; padding: 0.9rem 1rem; background: var(--panel); border-radius: 3px; border-left: 3px solid var(--mark); }
.answer.bad { --mark: var(--bad); }
.answer.good { --mark: var(--ok); }
.answer .who { font-family: var(--f-label); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.answer .said { font-size: 1rem; }
.answer .meta { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink-2); }
.answer .verdict { font-family: var(--f-label); font-size: 0.85rem; font-weight: 600; color: var(--mark); }
.provision { font-size: 0.95rem; color: var(--ink-2); border-left: 1px solid var(--rule); padding-left: 1rem; }
.provision b { color: var(--ink); font-weight: 600; }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1.5rem; }
figure { margin: 0; display: grid; gap: 0.5rem; min-width: 0; }
figcaption { font-family: var(--f-label); font-size: 0.85rem; color: var(--ink-2); }
figcaption b { color: var(--ink); font-weight: 600; }
svg { width: 100%; height: auto; display: block; }
svg .tick { font-family: var(--f-label); font-size: 11px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
svg .axis { font-family: var(--f-label); font-size: 11.5px; fill: var(--ink-2); }
svg .val { font-family: var(--f-label); font-size: 12px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
svg .lab { font-family: var(--f-label); font-size: 11.5px; fill: var(--ink); }
svg .lab.accent { fill: var(--accent); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-family: var(--f-label); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-weight: 500; color: var(--ink-2); font-size: 0.8rem; border-bottom: 1px solid var(--ink); vertical-align: bottom; white-space: normal; }
tbody tr.key td { font-weight: 600; }

ol.steps { margin: 0; padding-left: 1.4rem; display: grid; gap: 0.55rem; max-width: 65ch; }
ol.steps li::marker { font-family: var(--f-label); font-weight: 600; color: var(--ink-2); }
ul.limits { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.5rem; max-width: 65ch; }
code { font-family: var(--f-mono); font-size: 0.85em; background: var(--panel); padding: 0.05em 0.3em; border-radius: 2px; }
pre { font-family: var(--f-mono); font-size: 0.82rem; background: var(--panel); padding: 0.9rem 1rem; border-radius: 3px; overflow-x: auto; margin: 0; line-height: 1.5; }
footer { border-top: 1px solid var(--rule); padding-top: 1rem; font-family: var(--f-label); font-size: 0.85rem; color: var(--ink-2); display: grid; gap: 0.3rem; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 30rem) { body { font-size: 1rem; } .lede { font-size: 1.08rem; } }
</style>

<main class="page">
{{BODY}}
</main>

<script id="data" type="application/json">{{DATA}}</script>
<script>
{{CHARTJS}}
</script>
